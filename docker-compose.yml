services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-krater}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-krater}
      POSTGRES_DB: ${POSTGRES_DB:-krater}
    volumes:
      - krater_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-krater} -d ${POSTGRES_DB:-krater}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  portal:
    build: .
    env_file: .env
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    env_file: .env
    command: ["procrastinate", "--app=krater.worker.app.app", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Temporary self-hosted S3-compatible storage (gallery screenshots) until a real provider is chosen; see
  # docs/SPEC.md "Open questions". SeaweedFS rather than MinIO: MinIO stopped publishing community images in 2025.
  storage:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-latest}
    environment:
      S3_ACCESS_KEY: ${KRATER_S3_ACCESS_KEY_ID:-krater}
      S3_SECRET_KEY: ${KRATER_S3_SECRET_ACCESS_KEY:-krater-dev-secret}
    # The S3 gateway reads its credentials from a JSON file; write it from the env so no secret lives in the repo.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"krater","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -master.volumeSizeLimitMB=1024 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - krater_storage_data:/data

  # One-shot: create the bucket. Safe to re-run.
  storage-init:
    image: amazon/aws-cli:${AWS_CLI_VERSION:-latest}
    environment:
      AWS_ACCESS_KEY_ID: ${KRATER_S3_ACCESS_KEY_ID:-krater}
      AWS_SECRET_ACCESS_KEY: ${KRATER_S3_SECRET_ACCESS_KEY:-krater-dev-secret}
      AWS_DEFAULT_REGION: ${KRATER_S3_REGION:-us-east-1}
      BUCKET: ${KRATER_S3_BUCKET:-krater-screenshots}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        for i in $$(seq 1 30); do
          aws --endpoint-url http://storage:8333 s3api head-bucket --bucket "$$BUCKET" 2>/dev/null && exit 0;
          aws --endpoint-url http://storage:8333 s3 mb "s3://$$BUCKET" 2>/dev/null && exit 0;
          sleep 2;
        done; echo "storage not reachable" >&2; exit 1
    depends_on:
      - storage

volumes:
  krater_db_data:
  krater_storage_data:
