services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-krater}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-krater}
      POSTGRES_DB: ${POSTGRES_DB:-krater}
    volumes:
      - krater_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-krater} -d ${POSTGRES_DB:-krater}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  portal:
    build: .
    env_file: .env
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    env_file: .env
    command: ["procrastinate", "--app=krater.worker.app.app", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  krater_db_data:
